<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LS ELECTRIC 제품을 전력계통도 위에 매핑한 제품맵 — 제품 위치·공백·자료·사양 조회" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>LS ELECTRIC 전력계통 제품맵</title>
    <!-- 테마: 기본 라이트 고정. 헤더 토글로 다크를 고른 경우(저장값 'dark')만 첫 그리기 전에 복원 → 깜빡임 방지 -->
    <script>
      try {
        if (localStorage.getItem('lse-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    </script>
    <!-- 첫 화면(스플래시): 그리기 전에 정한다. 이 탭에서 이미 봤거나, #/경로 바로가기 링크이거나, 자동화 테스트(webdriver)면 건너뜀 -->
    <script>
      (function () {
        var r = document.documentElement;
        try {
          var h = location.hash;
          if (navigator.webdriver || (h && h !== '#' && h !== '#/') || sessionStorage.getItem('lse-splash-seen')) { r.classList.add('no-splash'); return; }
          sessionStorage.setItem('lse-splash-seen', '1');
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/splash.css" />
  </head>
  <body>
    <input type="checkbox" id="splash-skip" class="splash-skip" tabindex="-1" aria-hidden="true" />
    <div id="splash" class="splash" aria-hidden="true">
      <div class="sp-panel sp-top"></div><div class="sp-panel sp-bot"></div>
      <div class="sp-hline"></div>
      <div class="sp-center"><div class="sp-stage"><span class="sp-pill"><img src="/brand/ls-electric-logo-md.png" alt="" width="262" height="94" /><span class="sp-front"></span><svg class="sp-svg" viewBox="0 0 316 130" width="316" height="130" focusable="false"><rect class="sp-line" x="4" y="4" width="308" height="122" rx="14" pathLength="100"></rect><rect class="sp-spark" x="4" y="4" width="308" height="122" rx="14" pathLength="100"></rect></svg></span></div><div class="sp-sub">전력계통 제품맵</div></div>
      <div class="sp-hint">화면을 누르면 바로 넘어가요</div>
      <label for="splash-skip" class="sp-skip"></label>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/splash.js" defer></script>
  </body>
</html>
