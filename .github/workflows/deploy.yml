name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 실시간 전력수급은 Cloudflare Pages Function(/api/supply)이 5분 캐시로 직접 제공 → 20분 예약 빌드는 없앰 (2026-11-19).
  # 남은 예약: 6시간마다 1회 — 시장 동향 스냅샷(fetch-market) 갱신 + 대체용 data/supply.json 다시 만들기
  schedule:
    - cron: '7 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Cloudflare Pages(계정 이름 없는 주소) 배포 여부 — 저장소 Secret 이 둘 다 있을 때만
      CF_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 마켓뉴스 대시보드 공개 페이지 → src/data/market-feed.json (빌드에만 반영, 커밋하지 않음). 실패하면 커밋된 스냅샷 그대로
      - name: Fetch market feed (LSE 마켓뉴스)
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/fetch-market.mjs
      - run: npm run build
      - id: pages
        uses: actions/configure-pages@v5
      # 전력거래소 공개 데이터 → dist/data/supply.json (커밋하지 않음) — /api/supply 가 실패할 때 앱이 쓰는 대체 파일.
      # 키가 없거나 실패해도 배포는 계속 (스크립트가 늘 0으로 끝남)
      - name: Fetch power supply (KPX)
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/fetch-supply.mjs
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          # 이번 수집이 실패하면 지금 배포된 값을 '갱신 실패'로 다시 씀
          SUPPLY_PREV_URL: ${{ steps.pages.outputs.base_url }}/data/supply.json
      # 같은 dist 를 Cloudflare Pages 에도 올림 → https://lse-grid-map.pages.dev (base './' + HashRouter 라 그대로 동작)
      # 프로젝트가 없으면 처음 한 번 만들고, 실패해도 GitHub Pages 배포는 계속
      - name: Deploy to Cloudflare Pages
        if: env.CF_ENABLED == 'true'
        continue-on-error: true
        timeout-minutes: 4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        # functions/ (GET /api/supply) 도 함께 올라감. 수급 키는 Pages Secret 으로 등록(값은 표준입력으로만 전달, 로그에 남지 않음).
        # 토큰에 Pages 편집 권한이 없으면 secret put 이 실패 → 경고만 남기고 배포는 계속 (그때 /api/supply 는 502, 앱은 대체 파일)
        run: |
          npx --yes wrangler@4.155.0 pages project create lse-grid-map --production-branch=main || true
          if [ -n "$DATA_GO_KR_KEY" ]; then
            printf '%s' "$DATA_GO_KR_KEY" | npx --yes wrangler@4.155.0 pages secret put DATA_GO_KR_KEY --project-name=lse-grid-map               || echo "::warning title=Cloudflare 수급 키::DATA_GO_KR_KEY 를 Pages Secret 으로 등록하지 못함 (토큰 권한 확인) — /api/supply 는 대체 파일로 동작"
          else
            echo "::warning title=Cloudflare 수급 키::GitHub Secret DATA_GO_KR_KEY 가 없어 /api/supply 는 502 (앱은 대체 파일)"
          fi
          npx --yes wrangler@4.155.0 pages deploy dist --project-name=lse-grid-map --branch=main --commit-dirty=true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
